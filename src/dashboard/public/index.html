<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnzoBot - لوحة التحكم</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-animation">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>
    <div class="landing-container glass-panel">
        <div class="logo-area">
            <img src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Bot Logo" id="bot-landing-avatar" class="bouncing">
        </div>
        <h1>مرحباً بك في لوحة تحكم <span>EnzoBot</span></h1>
        <p>الواجهة الأسهل والأسرع لإدارة سيرفرك وتشكيل البوت بالطريقة التي تناسبك تماماً.</p>
        
        <div class="login-section">
            <a href="/auth/discord" class="btn-discord">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M19.27 5.33C17.94 4.71 16.5 4.26 15 4a.09.09 0 0 0-.07.03c-.18.33-.39.76-.53 1.09a16.09 16.09 0 0 0-4.8 0c-.14-.33-.35-.76-.53-1.09a.09.09 0 0 0-.07-.03c-1.5.26-2.94.71-4.27 1.33-.01 0-.02.01-.03.02-2.72 4.07-3.47 8.03-3.1 11.95 0 .02.01.04.03.05 1.8 1.32 3.53 2.12 5.24 2.65.03.01.06-.01.07-.04.4-.55.76-1.13 1.07-1.74.02-.04 0-.08-.04-.09-.57-.22-1.11-.48-1.64-.78-.04-.02-.04-.08-.01-.11.11-.08.22-.17.33-.25.02-.02.05-.02.07-.01 3.44 1.57 7.15 1.57 10.55 0 .02-.01.05-.01.07.01.11.08.22.17.33.25.03.03.03.09-.01.11-.52.3-1.07.56-1.64.78-.04.01-.05.06-.04.09.32.61.68 1.19 1.07 1.74.01.03.04.05.07.04 1.71-.53 3.44-1.33 5.24-2.65.02-.01.03-.03.03-.05.44-4.53-.73-8.46-3.1-11.95-.01-.01-.02-.02-.03-.02zM8.52 14.91c-1.03 0-1.89-.95-1.89-2.12s.84-2.12 1.89-2.12c1.06 0 1.9.96 1.89 2.12 0 1.17-.84 2.12-1.89 2.12zm6.97 0c-1.03 0-1.89-.95-1.89-2.12s.84-2.12 1.89-2.12c1.06 0 1.9.96 1.89 2.12 0 1.17-.83 2.12-1.89 2.12z"/></svg>
                تسجيل الدخول بـ Discord
            </a>
            <p class="error-msg" id="login-error" style="display: none;"></p>
        </div>
    </div>
    
    <script>
        fetch('/api/auth/status')
            .then(res => res.json())
            .then(data => {
                if(data.loggedIn) {
                    window.location.href = '/dashboard.html';
                }
            });
            
        // Get URL params for errors
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        if(error === 'access_denied') {
            const errEl = document.getElementById('login-error');
            errEl.textContent = 'تم رفض الوصول أو إلغاء تسجيل الدخول.';
            errEl.style.display = 'block';
        }
    </script>
</body>
</html>
